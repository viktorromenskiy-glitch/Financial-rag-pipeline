# Day 3 (plan_rabot_posle_ekspertizy_agent_profil.md): CUAD smoke-test config.
#
# "A CUAD smoke test... without changing any agent code - only retrieval
# index configuration and indexing new documents." This file is exactly
# that config: it doesn't change a single line in agent/ or pipeline/, it
# only points to a SEPARATE MongoDB collection/indexes so the 4 CUAD
# contracts never end up in the main financial corpus (t2_ragbench_full)
# under any circumstances, and never get mixed with it during retrieval.
#
# embedding.routing.enabled: false - per-dataset routing (voyage-finance-2
# for TAT-DQA) makes no sense for source_dataset="CUAD" (see
# pipeline/cuad_smoke.py); with routing.enabled=false,
# pipeline.embedding.resolve_embedding_model always returns
# embedding.model regardless of routed_sources, so leaving
# routed_sources empty here is safe.
#
# All other sections (enrichment/retrieval/reranker/generation/judge)
# DELIBERATELY match config/config.yaml - the point of the smoke test is
# to check the robustness of the ALREADY VALIDATED pipeline on a
# different document domain, not to test a new, stripped-down config.

mongodb:
  uri: ${MONGODB_URI}
  db_name: "rag_project"
  collection_name: "cuad_smoke_v1"       # a separate collection - not t2_ragbench_full
  vector_index_name: "cuad_smoke_vector_index"
  text_index_name: "cuad_smoke_text_index"

embedding:
  model: "voyage-4"
  batch_size: 32
  routing:
    enabled: false                       # CUAD doesn't take part in per-dataset routing (see above)
    finance_model: "voyage-finance-2"
    routed_sources: []

enrichment:
  enabled: true                          # same value as in the production config - see the note above
  model: "claude-haiku-4-5-20251001"
  temperature: 0.0
  prompt_version: "v1"

retrieval:
  pool_size: 50
  weights:
    vector: 0.5
    text: 0.5

reranker:
  enabled: true
  model: "rerank-v4.0-pro"
  pool_size: 50
  top_n: 5

generation:
  model: "claude-sonnet-5"
  temperature: 0.0

judge:
  model: "claude-sonnet-5"
  temperature: 0.0
  prompt_version: "v3"
  deterministic_check_enabled: true      # ignored for CUAD calls - scripts/run_cuad_smoke.py passes deterministic_check_enabled=False explicitly (CUAD gold answers are text spans, not numbers - see that script)

retry:
  stop_after_attempt: 5
  wait_min_seconds: 1
  wait_max_seconds: 60

agent:
  max_additional_tool_calls: 2           # same bounded-loop config as production - this is what's being robustness-checked
  max_wall_clock_seconds: 120
  enable_deictic_entity_guard: true      # validated specifically against this dataset's 5 real questions - see agent/loop.py's _deictic_entity_guard_should_block docstring and claude/itog_ekspertizy_cuad_overrefusal_fix.md, item 1. Left at the config default (false) in config/config.yaml for now - one variable at a time.

agent_eval:
  # Fewer questions (5, not 20-30), so the safety limits for the whole run
  # are smaller too - see AgentEvalConfig in config/config_schema.py for
  # the sizing at 20-30 questions; the same principle applies here - "1
  # mandatory + up to agent.max_additional_tool_calls additional
  # assessment calls + 1 generation" per question, just n=5 instead of 20-30.
  max_llm_calls: 60
  max_wall_clock_seconds: 1200
  max_estimated_cost_usd: 2.0
  cost_per_llm_call_usd: 0.02

persistence:
  google_drive_results_dir: "/content/drive/MyDrive/RAG-project/results"
