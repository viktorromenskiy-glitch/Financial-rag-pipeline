# Phase 5 A/B variant (docs/tehnicheskoe_zadanie.md, section 28): identical
# to config.yaml in everything except generation.prompt_variant. Used in
# Phase 6 for a paired run against baseline the same way:
#   python -m pipeline.cli eval --config config/config_formula_base.yaml \
#     --questions data/t2-ragbench/eval_subset_250.parquet --run-id <...>
# Target: taxonomy category C (docs/tehnicheskoe_zadanie.md, section 27) - 3/25 (12%),
# confirmed by exact arithmetic (not an assumption).

mongodb:
  uri: ${MONGODB_URI}                 # from .env, not hardcoded
  db_name: "rag_project"
  collection_name: "t2_ragbench_full"
  vector_index_name: "vector_index_full"
  text_index_name: "text_index_full"

embedding:
  model: "voyage-4"
  batch_size: 32
  routing:
    enabled: true                     # per-dataset embedding routing - see tehnicheskoe_zadanie.md, section 3a (added 2026-08-15)
    finance_model: "voyage-finance-2"
    routed_sources: ["TAT-DQA"]       # TAT-DQA only (Recall@5 +1.9pp, McNemar p=0.0005, n=2500) - ConvFinQA (-1.9pp, p=0.0000) and FinQA (-0.9pp, not stable) stay on embedding.model

enrichment:
  enabled: true                       # decision confirmed 2026-08-18 by the full-corpus test (n=900, tehnicheskoe_zadanie.md, section 5): no effect from enrichment+reranker together was detected at the >=2pp level (delta=+0.1pp, McNemar p=1.0), but no harm was shown either - the only significant measured effect remains +0.78pp without the reranker on the reduced corpus (n=1535, p=0.0164); the cost over the full corpus is moderate (~$10), so there's no reason to disable it by default
  model: "claude-haiku-4-5-20251001"
  temperature: 0.0
  prompt_version: "v1"                # part of the judge cache key and run_config.json - see tehnicheskoe_zadanie.md, section 8/section 11

retrieval:
  pool_size: 50
  weights:
    vector: 0.5
    text: 0.5

reranker:
  enabled: true
  model: "rerank-v4.0-pro"
  pool_size: 50
  top_n: 5

generation:
  model: "claude-sonnet-5"
  temperature: 0.0
  prompt_variant: "formula_base"       # Phase 5 - see pipeline/generation.py, PROMPT_TEMPLATE_FORMULA_BASE

judge:
  model: "claude-sonnet-5"
  temperature: 0.0
  prompt_version: "v3"                # bumped 2026-08-15 with JUDGE_PROMPT revision (pipeline/evaluation.py) — must match PROMPT_VERSION there so judge_cache.jsonl is correctly invalidated
  deterministic_check_enabled: true

retry:
  stop_after_attempt: 5
  wait_min_seconds: 1
  wait_max_seconds: 60
  # retry only transient errors (429/5xx/timeout), not 4xx - see tehnicheskoe_zadanie.md, section 11

persistence:
  google_drive_results_dir: "/content/drive/MyDrive/RAG-project/results"
