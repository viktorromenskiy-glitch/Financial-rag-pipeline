mongodb:
  uri: ${MONGODB_URI}                 # from .env, not hardcoded
  db_name: "rag_project"
  collection_name: "t2_ragbench_full"
  vector_index_name: "vector_index_full"
  text_index_name: "text_index_full"

embedding:
  model: "voyage-4"
  batch_size: 32
  routing:
    enabled: true                     # per-dataset embedding routing - see tehnicheskoe_zadanie.md, section 3a (added 2026-08-15)
    finance_model: "voyage-finance-2"
    routed_sources: ["TAT-DQA"]       # TAT-DQA only (Recall@5 +1.9pp, McNemar p=0.0005, n=2500) - ConvFinQA (-1.9pp, p=0.0000) and FinQA (-0.9pp, not stable) stay on embedding.model

enrichment:
  enabled: true                       # decision confirmed 2026-08-18 by the full-corpus test (n=900, tehnicheskoe_zadanie.md, section 5): no effect from enrichment+reranker together was detected at the >=2pp level (delta=+0.1pp, McNemar p=1.0), but no harm was shown either - the only significant measured effect remains +0.78pp without the reranker on the reduced corpus (n=1535, p=0.0164); the cost over the full corpus is moderate (~$10), so there's no reason to disable it by default
  model: "claude-haiku-4-5-20251001"
  temperature: 0.0
  prompt_version: "v1"                # part of the judge cache key and run_config.json - see tehnicheskoe_zadanie.md, section 8/section 11

retrieval:
  pool_size: 50
  weights:
    vector: 0.5
    text: 0.5

reranker:
  enabled: true
  model: "rerank-v4.0-pro"
  pool_size: 50
  top_n: 5

generation:
  model: "claude-sonnet-5"
  temperature: 0.0

judge:
  model: "claude-sonnet-5"
  temperature: 0.0
  prompt_version: "v3"                # bumped 2026-08-15 with JUDGE_PROMPT revision (pipeline/evaluation.py) — must match PROMPT_VERSION there so judge_cache.jsonl is correctly invalidated
  deterministic_check_enabled: true

retry:
  stop_after_attempt: 5
  wait_min_seconds: 1
  wait_max_seconds: 60
  # retry only transient errors (429/5xx/timeout), not 4xx - see tehnicheskoe_zadanie.md, section 11

agent:
  # Bounded agentic tool-use loop (agent/) - see itog_ekspertizy_agent_profil.md
  # (4 independent experts, consensus in section 3): the limit is a config
  # parameter, not a constant in the code.
  max_additional_tool_calls: 2
  # Day 2 - per-question wall-clock safety limit (agent/loop.py's
  # run_agent_query max_wall_clock_seconds). null = disabled. The value
  # below is a conservative allowance for 1 mandatory + 2 additional
  # assessment/retrieval cycles plus the final generation for one question.
  max_wall_clock_seconds: 120

agent_eval:
  # Day 2 - global safety limits for the WHOLE evaluation harness run
  # (scripts/run_agent_eval.py), not per question - see
  # config/config_schema.py's AgentEvalConfig for the full sizing rationale.
  max_llm_calls: 400
  max_wall_clock_seconds: 5400
  max_estimated_cost_usd: 10.0
  cost_per_llm_call_usd: 0.02

persistence:
  # The canonical path for saving results of paid runs to Google Drive -
  # see "Rules for persisting results of long paid runs" in the project and pipeline/common/persist.py.
  # Case matters: "RAG-project" - matching what's already created on Drive (notebooks/experiments_weeks_1_2.ipynb).
  google_drive_results_dir: "/content/drive/MyDrive/RAG-project/results"
