mongodb:
  uri: ${MONGODB_URI}                 # из .env, не хардкод
  db_name: "rag_project"
  collection_name: "t2_ragbench_full"
  vector_index_name: "vector_index_full"
  text_index_name: "text_index_full"

embedding:
  model: "voyage-4"
  batch_size: 32

enrichment:
  enabled: true
  model: "claude-haiku-4-5-20251001"
  temperature: 0.0
  prompt_version: "v1"                # часть ключа кэша судьи и run_config.json — см. ТЗ п.8/п.11

retrieval:
  pool_size: 50
  weights:
    vector: 0.5
    text: 0.5

reranker:
  enabled: true
  model: "rerank-v4.0-pro"
  pool_size: 50
  top_n: 5

generation:
  model: "claude-sonnet-5"
  temperature: 0.0

judge:
  model: "claude-sonnet-5"
  temperature: 0.0
  prompt_version: "v2"                # bumped 2026-08-15 with JUDGE_PROMPT revision (pipeline/evaluation.py) — must match PROMPT_VERSION there so judge_cache.jsonl is correctly invalidated
  deterministic_check_enabled: true

retry:
  stop_after_attempt: 5
  wait_min_seconds: 1
  wait_max_seconds: 60
  # ретраить только transient-ошибки (429/5xx/timeout), не 4xx — см. ТЗ п.11


